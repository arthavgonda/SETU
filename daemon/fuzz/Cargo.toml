[package]
name = "setu-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
setu-common = { path = "../common" }

[workspace]

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_packet"
path = "fuzz_targets/engine_packet.rs"
test = false
doc = false
bench = false
