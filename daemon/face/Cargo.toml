[package]
name = "setu-face"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
setu-sherpa = { path = "../sherpa" }
serde.workspace = true
anyhow.workspace = true
zune-jpeg = "0.5"
jpeg-encoder = "0.6"
png = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Media_MediaFoundation"] }

[dev-dependencies]
fastrand = "2"
