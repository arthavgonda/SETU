[workspace]
resolver = "3"
members = ["common", "sherpa", "audio", "face", "core", "engine", "system", "facecheck", "pam", "credprov"]

[workspace.package]
version = "1.8.3"
edition = "2024"
license = "LicenseRef-Setu"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"
tracing = "0.1"
crossbeam-channel = "0.5"
bindgen = "0.72"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
strip = "debuginfo"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
